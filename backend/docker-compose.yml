version: "3.8"

services:
  db:
    image: postgres:15
    container_name: tato-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: tato-backend
    command: flask run --host=0.0.0.0 --debugger --reload 
    volumes:
      - .:/app 
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=development 
    depends_on:
      - db


volumes:
  pgdata:
